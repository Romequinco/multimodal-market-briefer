[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-market-briefer"
version = "0.1.0"
description = "Briefing de mercados multimodal: noticias -> análisis con IA -> podcast a 2 voces, gráficos y vídeo."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
# Una sola fuente de verdad: los requirements*.txt (solo requisitos, sin opciones de pip).
dependencies = { file = ["requirements.txt"] }
optional-dependencies.local = { file = ["requirements-local.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
briefer = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Los tests "live" llaman a APIs reales (red + claves, cuestan dinero): excluidos por defecto.
# Para ejecutarlos: python -m pytest -m live
addopts = "-ra -m \"not live\""
markers = [
    "live: llama a proveedores reales (red, claves y coste); se excluye por defecto",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "app"]

[tool.ruff.lint]
# Errores reales (pyflakes, pycodestyle), imports ordenados, bugbear y sintaxis moderna.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.pycodestyle]
# El formato apunta a 110; E501 solo salta en líneas claramente largas (textos y tablas en tests).
max-line-length = 130

[tool.ruff.lint.isort]
known-first-party = ["briefer", "components"]

[tool.ruff.lint.per-file-ignores]
# Los scripts añaden src/ al sys.path antes de importar briefer.
"scripts/*.py" = ["E402"]
# CSS embebido y datos de prueba (HTML/RSS) en una línea.
"app/components/theme.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/briefer"]
ignore_missing_imports = true
warn_unused_ignores = true
